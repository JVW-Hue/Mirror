<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Account sign-in — Helix SSO for employees and authorized partners." />
<title>Sign in — Helix Technologies</title>
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<style>
  body { }
  .site-header { background: rgba(10, 22, 40, 0.95); border-bottom-color: #1a2a40; }
  .site-header .brand { color: #cfd8e3; }
  nav.main-nav a { color: #cfd8e3; }
  .signin-box {
    max-width: 400px;
    margin: 5rem auto;
    background: var(--c-surface);
    padding: 2.5rem;
    border: 1px solid #1a2a40;
    border-radius: 4px;
  }
  .signin-box h1 { color: #e8eef8; font-size: 1.5rem; margin-bottom: 0.5rem; }
  .signin-box label { color: #a0b0c0; }
  .signin-box input { background: var(--c-surface); border-color: #1a2a40; color: #e8eef8; }
  .signin-box .btn { width: 100%; }
  .signin-meta { font-family: var(--font-mono); font-size: 0.75rem; color: #5a6878; margin-top: 2rem; text-align: center; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark"></span>HELIX</a>
  </div>
</header>

<main>
  <div class="signin-box">
    <h1>Account sign-in</h1>
    <p style="color:#7a8696;font-size:0.9rem;margin-bottom:1.5rem;">For Helix employees and authorized partners.</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="user">Username</label>
        <input type="text" id="user" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="pass">Password</label>
        <input type="password" id="pass" autocomplete="off" />
      </div>
      <button type="submit" class="btn">Sign in</button>
      <div id="loginMsg" style="margin-top:1rem;font-size:0.85rem;font-family:var(--font-mono);"></div>
    </form>
    <div class="signin-meta">
      Helix SSO · v2.4.17 · session timeout 15min<br>
      access.log v2.4 · geo-fence: US-only
    </div>
  </div>
</main>

<footer class="site-footer" style="background:rgba(10, 22, 40, 0.7);border-top:1px solid #1a2a40;">
  <div class="container">
    <div >© 2014–2021 Helix Technologies, Inc. — internal use only</div>
    <div>
      <a href="legal.html" >Legal</a> ·
      <a href="sitemap.html" >Sitemap</a> ·
      <a href="contact.html" >Contact</a>
    </div>
  </div>
</footer>

<script src="assets/app.js"></script>
<script>
  // Default submit handler — the app.js will override this at stage 3+
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    document.getElementById("loginMsg").innerHTML = '<span style="color:#c0392b">invalid credentials.</span>';
  });
</script>
</body>
</html>
